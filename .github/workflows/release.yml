name: Release

# Triggered by pushing an ANNOTATED version tag (git tag -a v1.17.0 -m "..." && git push origin v1.17.0),
# not by every commit - unlike ci.yml, this actually publishes a public GitHub Release with an
# installer attached, so it only runs when a release is explicitly being cut. Must be annotated
# (-a -m), not a plain "git tag v1.17.0": the release-notes step below reads this tag's own message,
# and a lightweight tag has no message of its own - git resolves %(contents) for one by falling
# through to the *tagged commit's* message instead, which would silently ship whatever that commit
# message happened to say as the release notes and the in-app "What's New" text. The workflow fails
# fast in that case rather than doing that.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # vpk upload github creates/uploads release assets - the default GITHUB_TOKEN is
                   # read-only on many repos, and this job would otherwise fail at the upload step.

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Enforces a plain vX.Y.Z tag (no prerelease suffix, no 4th component) - AppInfo.Version reduces
      # the running app's AssemblyVersion to exactly 3 numeric components, and LibraryViewModel's
      # "What's New" dialog compares that directly against the marker's Version (the full string
      # vpk pack -v/VelopackAsset.Version.ToString() produced). A tag like v1.17.0-beta1 or v1.17.0.5
      # would still publish and successfully update, but AppInfo.Version could never equal it - the
      # update would silently work while the "What's New" dialog silently never appears. Failing here
      # keeps the version contract exact without having to carry a full SemanticVersion through
      # AssemblyVersion (which can't represent a prerelease suffix at all) just to compare it later.
      - name: Extract version from tag
        id: get-version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' isn't a plain vX.Y.Z version (no prerelease suffix, exactly 3 numeric components) - see this step's remarks for why that's required. Use a tag like v1.17.0."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The tag's own annotation message becomes both this release's notes file (fed to vpk pack below)
      # and the in-app "What's New" dialog's content after the next update (see
      # PendingUpdateNotesService/VelopackAsset.NotesMarkdown) - one source of truth, no separate
      # changelog file to keep in sync. Fails fast on a lightweight tag rather than silently extracting
      # the tagged *commit's* message instead (git's actual behavior for %(contents) on one - not the
      # empty string an earlier version of this step assumed) and shipping that as the release notes.
      #
      # Reads from a fresh fetch into refs/tags/__release_check__, not refs/tags/$GITHUB_REF_NAME
      # directly - actions/checkout's own final step always re-fetches the triggering ref pinned to
      # its resolved commit SHA (+<sha>:refs/tags/<name>), which silently rewrites the local tag ref to
      # point straight at the commit. That strips the annotation from *any* tag's local ref, genuinely
      # annotated or not, so both git cat-file -t and %(contents) on refs/tags/$GITHUB_REF_NAME itself
      # are unreliable after checkout has run - confirmed by v1.17.0's actual first two release
      # attempts, which failed/misbehaved this way despite the tag being properly annotated on GitHub.
      - name: Extract release notes from tag
        shell: bash
        run: |
          git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/__release_check__"
          if [ "$(git cat-file -t __release_check__)" != "tag" ]; then
            echo "::error::'$GITHUB_REF_NAME' is a lightweight tag, not an annotated one - re-tag with:" \
                 "git tag -a $GITHUB_REF_NAME -m \"release notes here\""
            exit 1
          fi
          git tag -l --format='%(contents)' __release_check__ > release-notes.md

      # Pinned to match the Velopack package version referenced by GameLauncher.csproj - Velopack
      # only officially supports matching vpk CLI / SDK versions, and an unpinned "latest" here would
      # silently drift out of sync with the app the next time vpk cuts a release.
      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Restore
        run: dotnet restore GameLauncher.sln

      # Same gate ci.yml enforces on every push/PR - a release is exactly the wrong place to skip it,
      # since a tag push here goes straight to a public GitHub Release with no other review step.
      - name: Test
        run: dotnet test GameLauncher.sln -c Release

      # default-api-key.txt is gitignored (see DefaultApiKey.cs's remarks - the key ships inside the
      # built exe, never in source control), so a fresh checkout never has one. Without this step every
      # public release silently ships with no default SteamGridDB key at all: Steam games still get
      # real box art (a separate, keyless CDN lookup), but every other source falls back to the exe
      # icon - or, for Xbox, no icon at all, since its MSIX package can't be extracted either - unless
      # the user finds Settings and pastes in their own key. STEAMGRIDDB_API_KEY must be set as a repo
      # secret (Settings > Secrets and variables > Actions) for this to have any effect; if it's unset
      # this just writes an empty file, which DefaultApiKey.Load() already treats as "no default" - not
      # a failure, just back to the same silently-missing-covers behavior this step exists to fix.
      - name: Write default SteamGridDB key
        shell: bash
        run: echo -n "${{ secrets.STEAMGRIDDB_API_KEY }}" > src/GameLauncher/default-api-key.txt

      # Not PublishSingleFile: vpk pack does its own bundling on top of a plain multi-file
      # self-contained publish (see GameLauncher.csproj's remarks on the StartupObject property).
      # -p:Version overrides the csproj's <Version> for this build only, so the published exe's
      # AssemblyVersion (and so AppInfo.Version, shown in Settings/About) always matches the tag
      # that triggered this release, even if the checked-in csproj value has fallen behind.
      - name: Publish
        run: >
          dotnet publish src/GameLauncher/GameLauncher.csproj -c Release -r win-x64 --self-contained -o publish
          -p:Version=${{ steps.get-version.outputs.version }}

      # Pulls the previous release's assets so vpk pack can compute a delta patch, not just a full
      # installer - the whole point of using Velopack over a bare "replace the exe" updater. Skips
      # silently (via continue-on-error) on the very first Velopack-based release, where there's
      # nothing yet to diff against.
      - name: Download previous release for delta patching
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      # -u is Velopack's package/app id, not a display name - it's baked into every installed user's
      # update-lock/shortcut/install-folder identity ("%LocalAppData%\<id>", the desktop shortcut's
      # filename, etc.), so it's user-visible in a way that matters. Deliberately just "GameLauncher",
      # not prefixed with an account/owner name - changing it after anyone has installed orphans their
      # existing install (a new id is a new app identity as far as Velopack/the OS are concerned), so
      # this was corrected immediately after the very first real release, before it had any real
      # installs to orphan.
      - name: Pack
        run: >
          vpk pack -u GameLauncher -v ${{ steps.get-version.outputs.version }} -p publish -e GameLauncher.exe
          --releaseNotes release-notes.md

      - name: Upload to GitHub Releases
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "Game Launcher v${{ steps.get-version.outputs.version }}"
          --tag ${{ github.ref_name }}
